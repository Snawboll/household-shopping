new_shop:
  target: &id001
    entity:
      integration: household_shopping
      domain: todo
  fields:
    store:
      selector: &id005
        text: {}
      example: Woolworths Woden
    items:
      selector:
        object: {}
      example:
      - Milk
      - name: Bananas
        qty: 5
new_quick_shop:
  target: *id001
  fields:
    store:
      selector:
        text: {}
      example: Aldi
    assignee:
      selector: &id002
        entity:
          domain: person
    items:
      selector:
        object: {}
      example:
      - Milk
      - Bread
    open_path:
      selector: &id003
        text: {}
      example: /household-shopping/shop
assign_shop:
  target: *id001
  fields:
    shop_id:
      selector: &id004
        text: {}
    assignee:
      selector: *id002
    open_path:
      selector: *id003
      example: /household-shopping/shop
remind_shop:
  target: *id001
  fields:
    shop_id:
      selector: *id004
    open_path:
      selector: *id003
      example: /household-shopping/shop
start_shopping:
  target: *id001
  fields:
    store:
      selector: *id005
      example: Woolworths Woden
    shop_id:
      selector: *id004
set_store:
  target: *id001
  fields:
    store:
      selector:
        text: {}
      example: Woolworths Woden
    shop_id:
      selector: *id004
finish_shop:
  target: *id001
  fields:
    shop_id:
      selector: *id004
cancel_shop:
  target: *id001
  fields:
    shop_id:
      selector: *id004
repeat_shop:
  target: *id001
  fields:
    shop_id:
      required: true
      selector:
        text: {}
add_item:
  target: *id001
  fields:
    name:
      selector: *id005
      required: true
      example: Milk
    note:
      selector: *id005
      example: Dairy Farmers 3L
    aisle:
      selector: *id005
      example: Dairy & Eggs
    qty:
      selector: &id006
        number:
          min: 1
          max: 99
          mode: box
      example: 2
    shop_id:
      selector: *id004
    remember:
      selector:
        boolean: {}
update_item:
  target: *id001
  fields:
    item:
      selector: *id005
      required: true
      example: Milk
    name:
      selector: *id005
    note:
      selector: *id005
    aisle:
      selector: *id005
    qty:
      selector: *id006
      example: 2
    shop_id:
      selector: *id004
set_item_state:
  target: *id001
  fields:
    item:
      selector: *id005
      required: true
      example: Eggs
    state:
      selector:
        select:
          options:
          - needed
          - got
          - missing
      required: true
    shop_id:
      selector: *id004
remove_item:
  target: *id001
  fields:
    item:
      selector: *id005
      required: true
      example: Milk
    shop_id:
      selector: *id004
toggle_stock:
  target: *id001
  fields:
    name:
      selector: *id005
      required: true
      example: Milk
    'on':
      selector:
        boolean: {}
      required: true
get_history:
  target: *id001
  fields:
    limit:
      selector:
        number:
          min: 1
          max: 100
      default: 10
add_stock_item:
  target: *id001
  fields:
    name:
      selector: *id005
      required: true
      example: Full cream milk
    location:
      selector: *id005
      example: Fridge
    aisle:
      selector: *id005
      example: Dairy & Eggs
    note:
      selector: *id005
      example: Dairy Farmers 3L
    icon:
      selector: *id005
      example: 🥛
    qty:
      selector: *id006
      example: 2
add_occasional_item:
  target: *id001
  fields:
    name:
      selector: *id005
      required: true
      example: Sunscreen
    aisle:
      selector: *id005
      example: Health & Beauty
    note:
      selector: *id005
    icon:
      selector: *id005
    qty:
      selector: *id006
      example: 2
update_catalogue_item:
  target: *id001
  fields:
    name:
      selector: *id005
      required: true
      example: Milk
    new_name:
      selector: *id005
    location:
      selector: *id005
    aisle:
      selector: *id005
    note:
      selector: *id005
    icon:
      selector: *id005
    qty:
      selector: *id006
      example: 2
promote_to_stock:
  target: *id001
  fields:
    name:
      selector: *id005
      required: true
      example: Sunscreen
    location:
      selector: *id005
      example: Bathroom
demote_to_occasional:
  target: *id001
  fields:
    name:
      selector: *id005
      required: true
      example: Sunscreen
remove_catalogue_item:
  target: *id001
  fields:
    name:
      selector: *id005
      required: true
      example: Sunscreen
import_catalogue:
  target: *id001
  fields:
    items:
      selector:
        object: {}
      required: true
      example:
      - name: Full cream milk
        kind: stock
        location: Fridge
        aisle: Dairy & Eggs
        note: Dairy Farmers 3L
    kind:
      selector:
        select:
          options:
          - stock
          - occasional
      default: occasional
get_catalogue:
  target: *id001
set_item_image:
  target: *id001
  fields:
    name:
      selector: *id005
      required: true
      example: Milk
    image_url:
      selector: *id005
    image_data:
      selector:
        text:
          multiline: true
    source:
      selector:
        select:
          options:
          - own
          - openfoodfacts
          - other
      default: other
    attribution:
      selector: *id005
    force:
      selector:
        boolean: {}
      default: false
clear_item_image:
  target: *id001
  fields:
    name:
      selector: *id005
      required: true
      example: Milk
add_group:
  target: *id001
  fields:
    type:
      selector: &id007
        select:
          options:
          - location
          - aisle
      required: true
    name:
      selector: *id005
      required: true
      example: Garage
    icon:
      selector: *id005
      example: 🚗
update_group:
  target: *id001
  fields:
    type:
      selector: *id007
      required: true
    group:
      selector: *id005
      required: true
      example: Garage
    name:
      selector: *id005
    icon:
      selector: *id005
remove_group:
  target: *id001
  fields:
    type:
      selector: *id007
      required: true
    group:
      selector: *id005
      required: true
      example: Garage
order_groups:
  target: *id001
  fields:
    type:
      selector: *id007
      required: true
    groups:
      selector:
        text:
          multiple: true
      required: true
      example:
      - Fruit & Veg
      - Bakery
